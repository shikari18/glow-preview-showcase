<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 480" width="100%" height="100%" class="rounded-2xl bg-white shadow-sm border border-slate-200">
  <defs>
    <linearGradient id="curveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>

  <!-- Title Banner -->
  <rect x="0" y="0" width="840" height="52" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1" />
  <text x="420" y="32" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#0f172a">
    Cambridge IGCSE 0580 Mathematics · Quadratic Function Parabola Anatomy
  </text>

  <!-- Graph Grid -->
  <g transform="translate(100, 80)">
    <!-- Light Grid Lines -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f1f5f9" stroke-width="1" />
    </pattern>
    <rect x="0" y="0" width="640" height="340" fill="url(#grid)" />

    <!-- X-Axis and Y-Axis -->
    <!-- X-Axis at y=240 -->
    <line x1="20" y1="240" x2="620" y2="240" stroke="#334155" stroke-width="2" />
    <polygon points="625,240 615,235 615,245" fill="#334155" />
    <text x="635" y="244" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#334155">x</text>

    <!-- Y-Axis at x=320 -->
    <line x1="320" y1="320" x2="320" y2="20" stroke="#334155" stroke-width="2" />
    <polygon points="320,15 315,25 325,25" fill="#334155" />
    <text x="320" y="10" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#334155">y</text>

    <!-- Axis of Symmetry (Dashed Vertical Line at x=320) -->
    <line x1="320" y1="30" x2="320" y2="330" stroke="#ef4444" stroke-width="2" stroke-dasharray="6,4" />
    <rect x="235" y="35" width="170" height="22" rx="6" fill="#fee2e2" stroke="#fca5a5" />
    <text x="320" y="50" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#b91c1c">
      Axis of Symmetry: x = -b / 2a
    </text>

    <!-- Parabola Curve y = ax^2 + bx + c (Opening upwards, vertex at (320, 280)) -->
    <!-- Roots at x=200 and x=440 on the x-axis (y=240) -->
    <path d="M 120 60 Q 320 400 520 60" fill="none" stroke="url(#curveGrad)" stroke-width="4" stroke-linecap="round" />

    <!-- Root 1 (x1, 0) -->
    <circle cx="215" cy="240" r="6" fill="#16a34a" stroke="#ffffff" stroke-width="2" />
    <rect x="150" y="255" width="110" height="22" rx="6" fill="#dcfce7" stroke="#86efac" />
    <text x="205" y="270" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#15803d">
      Root x₁ (y = 0)
    </text>

    <!-- Root 2 (x2, 0) -->
    <circle cx="425" cy="240" r="6" fill="#16a34a" stroke="#ffffff" stroke-width="2" />
    <rect x="380" y="255" width="110" height="22" rx="6" fill="#dcfce7" stroke="#86efac" />
    <text x="435" y="270" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#15803d">
      Root x₂ (y = 0)
    </text>

    <!-- Minimum Vertex Point (h, k) -->
    <circle cx="320" cy="290" r="7" fill="#dc2626" stroke="#ffffff" stroke-width="2" />
    <rect x="250" y="305" width="140" height="24" rx="6" fill="#fee2e2" stroke="#fca5a5" />
    <text x="320" y="321" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#991b1b">
      Vertex Minimum (h, k)
    </text>

    <!-- Equation Badge -->
    <g transform="translate(420, 80)">
      <rect x="0" y="0" width="190" height="54" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" />
      <text x="95" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#1d4ed8">
        y = ax² + bx + c
      </text>
      <text x="95" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#3b82f6">
        When a &gt; 0, curve is U-shaped
      </text>
    </g>
  </g>

  <!-- Formula Callout at Bottom -->
  <g transform="translate(60, 435)">
    <rect x="0" y="0" width="720" height="32" rx="16" fill="#f8fafc" stroke="#e2e8f0" />
    <text x="360" y="21" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#334155">
      <tspan font-weight="700">Quadratic Formula: </tspan>
      x = (-b ± √(b² - 4ac)) / 2a · Discriminant Δ = b² - 4ac determines number of real roots.
    </text>
  </g>
</svg>
